# GitHub Actions Workflow responsible for cleaning up the template repository from
# the template-specific files and configurations. This workflow is supposed to be triggered automatically
# when a new template-based repository has been created.

name: Template Cleanup
on:
  push:
    branches:
      - main

jobs:
  template-cleanup:
    name: Template Cleanup
    runs-on: ubuntu-latest
    if: github.event.repository.name != 'compose-template'
    steps:

      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v4
      # Replace the template README with the generated-repo one and drop template-only files
      - name: Cleanup
        run: |
          sed -e "s/%NAME%/${{ github.event.repository.name }}/g" \
              -e "s#%REPOSITORY%#${{ github.repository }}#g" \
              .github/template-cleanup/README.md > README.md
          rm -rf .github/template-cleanup
      # Commit modified files
      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Template cleanup"
      # Push changes
      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
